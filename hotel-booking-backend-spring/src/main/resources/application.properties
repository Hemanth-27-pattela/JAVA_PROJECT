# ===================================================================
# Hotel Booking Backend - Spring Boot Configuration
# Port: 5001 (Matching Vite Frontend's default target)
# ===================================================================
server.port=5001

# ===================================================================
# MySQL Database Configuration
# Configured via environment variables with safe development defaults
# ===================================================================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hotel_booking}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=0

# ===================================================================
# Database Migrations (Flyway)
# ===================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Jackson JSON Serialization
# Output ISO-8601 strings for dates (matching Mongoose format)
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# Application & Security Settings
# ===================================================================
app.jwt.secret=${JWT_SECRET_KEY:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend.url=${FRONTEND_URL:http://localhost:5174}

# ===================================================================
# Multipart & Cloudinary Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===================================================================
# SpringDoc OpenAPI / Swagger UI
# Matching Express Swagger path: /api-docs
# ===================================================================
springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# Payment Gateway Configuration (Stripe vs Simulation)
# ===================================================================
app.payment.mode=${PAYMENT_MODE:simulation}
stripe.api-key=${STRIPE_API_KEY:}
stripe.api-url=${STRIPE_API_URL:https://api.stripe.com}

# ===================================================================
# AI Assist Configuration
# Disabled by default; fallback to deterministic template stub when enabled
# ===================================================================
app.ai.enabled=${AI_ASSIST_ENABLED:false}

# ===================================================================
# Database Demo Seeder
# Runs only when hotels table is empty (e.g. initial launch)
# ===================================================================
app.seeder.enabled=${APP_SEEDER_ENABLED:false}



