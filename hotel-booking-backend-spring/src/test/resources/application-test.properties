# ===================================================================
# Test Profile Configuration (In-Memory H2 for Fast Isolated Tests)
# ===================================================================
server.port=0

spring.datasource.url=jdbc:h2:mem:hotel_booking_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=defaultSecretKeyForDevelopmentMustBeOverriddenInProductionWithAStrongSecretKeyAtLeast256BitsLong
app.jwt.expiration-ms=86400000
app.frontend.url=http://localhost:5174

springdoc.swagger-ui.enabled=false

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

app.payment.mode=simulation
stripe.api-key=test_stripe_secret_key
app.ai.enabled=false
app.seeder.enabled=false


